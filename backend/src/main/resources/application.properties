spring.application.name=stocka-api
spring.jackson.deserialization.accept-float-as-int=false
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STOCKA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
stocka.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
